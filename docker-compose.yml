version: '3.8'

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile.dev

# node_modules are named volumes so the Windows bind mount below doesn't shadow
# the Linux-built packages. They only seed from the image on first creation, so
# after changing any package.json run:
#   docker compose down && docker volume rm vedhkrit_node_modules vedhkrit_web_node_modules vedhkrit_platform_node_modules vedhkrit_database_node_modules && docker compose up -d --build
x-app-volumes: &app-volumes
  - .:/app
  - node_modules:/app/node_modules
  - web_node_modules:/app/apps/web/node_modules
  - platform_node_modules:/app/apps/platform/node_modules
  - database_node_modules:/app/packages/database/node_modules

services:
  postgres:
    image: postgres:15-alpine
    container_name: vedhkrit-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vedhkrit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: *app-build
    image: vedhkrit-app:dev
    container_name: vedhkrit-api
    command: npm run dev --workspace=@vedhkrit/platform
    env_file:
      - apps/platform/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vedhkrit?schema=public
      WEB_ORIGIN: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      # "true" auto-activates new signups (no email provider needed). Locally we
      # leave it off so the real OTP flow stays exercised.
      DEMO_MODE: "${DEMO_MODE:-false}"
    ports:
      - "5000:5000"
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: *app-build
    image: vedhkrit-app:dev
    container_name: vedhkrit-web
    command: npm run dev --workspace=@vedhkrit/web
    environment:
      VITE_API_URL: http://localhost:5000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8080:8080"
    volumes: *app-volumes
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  node_modules:
  web_node_modules:
  platform_node_modules:
  database_node_modules:
