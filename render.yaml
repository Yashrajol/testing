databases:
  - name: vedhkrit-db
    databaseName: vedhkrit
    plan: free

services:
  - type: web
    name: vedhkrit-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vedhkrit-db
          property: connectionString
      # Generated once by Render; never commit a real secret.
      - key: JWT_SECRET
        generateValue: true
      # Set this to your Vercel URL after the frontend is deployed.
      - key: WEB_ORIGIN
        sync: false
      # Demo signups skip email OTP. Do not enable for real users.
      - key: DEMO_MODE
        value: "true"
